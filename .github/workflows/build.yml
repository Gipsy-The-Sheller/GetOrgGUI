name: build-windows

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PKG_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('1.8.0.1-{0}', github.sha) }}

jobs:
  build-x64:
    name: Windows x86_64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          cache: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-bzip2
            mingw-w64-x86_64-libdeflate
            mingw-w64-x86_64-isa-l
            mingw-w64-x86_64-libsystre
            mingw-w64-x86_64-libtre
            mingw-w64-x86_64-gettext-runtime
            mingw-w64-x86_64-libiconv
            mingw-w64-x86_64-pkgconf
            zip

      - name: Build dependencies
        run: bash ./scripts/build_all.sh x86_64

      - name: Smoke test
        run: |
          ./stage/x64/samtools/bin/samtools.exe --version
          ./stage/x64/bowtie2/bowtie2-align-s.exe --version
          ./stage/x64/fastp/fastp.exe --version
          ./stage/x64/ncbi-blast/blastn.exe -version
          ./stage/x64/ncbi-blast/tblastn.exe -version
          ./stage/x64/spades/bin/spades-core.exe || true

      - name: Package
        run: bash ./scripts/package.sh x86_64 "${{ env.PKG_VERSION }}"

      - uses: actions/upload-artifact@v4
        with:
          name: GetOrganelle-Windows-x64
          path: |
            build/ci-x64/*.zip
            build/ci-x64/*.sha256
          if-no-files-found: error

  build-arm64:
    name: Windows arm64
    # GitHub-hosted Windows arm64 runner.
    runs-on: windows-11-arm
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          cache: true
          install: >-
            mingw-w64-clang-aarch64-toolchain
            mingw-w64-clang-aarch64-cmake
            mingw-w64-clang-aarch64-ninja
            mingw-w64-clang-aarch64-zlib
            mingw-w64-clang-aarch64-bzip2
            mingw-w64-clang-aarch64-libdeflate
            mingw-w64-clang-aarch64-isa-l
            mingw-w64-clang-aarch64-libsystre
            mingw-w64-clang-aarch64-libtre
            mingw-w64-clang-aarch64-gettext-runtime
            mingw-w64-clang-aarch64-libiconv
            mingw-w64-clang-aarch64-pkgconf
            zip

      - name: Build dependencies
        run: bash ./scripts/build_all.sh arm64

      - name: Smoke test
        run: |
          ./stage/arm64/samtools/bin/samtools.exe --version
          ./stage/arm64/bowtie2/bowtie2-align-s.exe --version
          ./stage/arm64/fastp/fastp.exe --version
          ./stage/arm64/ncbi-blast/blastn.exe -version
          ./stage/arm64/ncbi-blast/tblastn.exe -version
          ./stage/arm64/spades/bin/spades-core.exe || true

      - name: Package
        run: bash ./scripts/package.sh arm64 "${{ env.PKG_VERSION }}"

      - uses: actions/upload-artifact@v4
        with:
          name: GetOrganelle-Windows-arm64
          path: |
            build/ci-arm64/*.zip
            build/ci-arm64/*.sha256
          if-no-files-found: error

  build-linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config zlib1g-dev libbz2-dev \
            libisal-dev libdeflate-dev perl curl zip

      - name: Build dependencies
        run: bash ./scripts/build_all.sh x86_64

      - name: Smoke test
        run: |
          ./stage/linux-x64/samtools/bin/samtools --version
          ./stage/linux-x64/bowtie2/bowtie2-align-s --version
          ./stage/linux-x64/fastp/fastp --version
          ./stage/linux-x64/ncbi-blast/blastn -version
          ./stage/linux-x64/ncbi-blast/tblastn -version
          ./stage/linux-x64/spades/bin/spades-core || true

      - name: Package
        run: bash ./scripts/package.sh x86_64 "${{ env.PKG_VERSION }}"

      - uses: actions/upload-artifact@v4
        with:
          name: GetOrganelle-Linux-x64
          path: |
            build/ci-linux-x64/*.tar.gz
            build/ci-linux-x64/*.sha256
          if-no-files-found: error

  build-macos:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install cmake ninja bzip2 libomp isa-l libdeflate pkg-config

      - name: Build dependencies
        run: bash ./scripts/build_all.sh arm64

      - name: Smoke test
        run: |
          ./stage/macos-arm64/samtools/bin/samtools --version
          ./stage/macos-arm64/bowtie2/bowtie2-align-s --version
          ./stage/macos-arm64/fastp/fastp --version
          ./stage/macos-arm64/ncbi-blast/blastn -version
          ./stage/macos-arm64/ncbi-blast/tblastn -version
          ./stage/macos-arm64/spades/bin/spades-core || true

      - name: Package
        run: bash ./scripts/package.sh arm64 "${{ env.PKG_VERSION }}"

      - uses: actions/upload-artifact@v4
        with:
          name: GetOrganelle-macOS-arm64
          path: |
            build/ci-macos-arm64/*.tar.gz
            build/ci-macos-arm64/*.sha256
          if-no-files-found: error

  gui-tests:
    name: GUI tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GUI dependencies
        run: python -m pip install --upgrade pip PyQt5==5.15.11 numpy gekko requests

      - name: Core tests
        run: python -m unittest discover -s gui/tests -p "test_*.py" -v

      - name: GUI smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python gui/tests/gui_smoke.py

      - name: YRTools entry smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python gui/tests/yrtools_smoke.py

      - name: BLAST integration smoke test (optional)
        run: python gui/tests/blast_smoke.py

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-x64, build-arm64, build-linux, build-macos, gui-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.sha256
          generate_release_notes: true
